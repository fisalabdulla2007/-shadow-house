<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Shadow House 3D</title>
<style>
html,body{margin:0;height:100%;background:#050608;color:#eee;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#game{position:fixed;inset:0;background:#050608}canvas{width:100%;height:100%;display:block;touch-action:none}#ui{position:absolute;inset:0;pointer-events:none}#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;font-size:13px;text-shadow:0 2px 8px #000}.panel{background:#080a0dcc;border:1px solid #ffffff20;border-radius:12px;padding:8px 10px}#msg{position:absolute;left:7%;right:7%;bottom:19%;text-align:center;font-size:16px;text-shadow:0 2px 8px #000;opacity:.94}#controls{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 16px;pointer-events:auto}.pad{display:grid;grid-template-columns:repeat(3,50px);gap:7px}.action{display:grid;grid-template-columns:repeat(2,68px);gap:8px}button{min-width:50px;min-height:50px;border-radius:14px;border:1px solid #7778;background:#11141acc;color:#fff;font-weight:700;touch-action:none}.action button{width:68px;font-size:12px}.pad button{font-size:18px}#start{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#242831,#050608 70%);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;pointer-events:auto}#start h1{font-size:38px;margin:0 0 8px;letter-spacing:3px}#start p{max-width:330px;color:#aaa;line-height:1.8;margin:8px 0 20px}#start button{width:190px;height:56px;font-size:17px}.hidden{display:none!important}.hit{animation:shake .18s linear 2}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
</style>
</head>
<body>
<div id="game"><canvas id="c"></canvas><div id="ui">
<div id="top"><span class="panel">🌑 Shadow House</span><span class="panel" id="time">12:00 AM</span></div>
<div id="msg">ابحث عن المفتاح... ولا تثق بالأصوات.</div>
<div id="controls"><div class="pad"><button data-k="up">▲</button><button data-k="turnL">↶</button><button data-k="down">▼</button><button data-k="left">◀</button><button data-k="light">🔦</button><button data-k="right">▶</button></div><div class="action"><button data-k="interact">تفاعل</button><button data-k="run">جري</button></div></div>
</div><div id="start"><h1>SHADOW HOUSE</h1><p>منزل مهجور. مفتاح واحد. شيء لا يجب أن تراه.<br>اعثر على المفتاح، شغّل المولد، ثم اهرب قبل أن يصل إليك الظل.</p><button id="play">ابدأ اللعبة</button></div></div>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d'),msg=document.getElementById('msg'),timeEl=document.getElementById('time'),start=document.getElementById('start'),game=document.getElementById('game');let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const map=["111111111111","100000000001","101111011101","100001010001","101101010101","100100000101","110111011101","100000010001","101111010101","100001000001","101101111101","100000000001","111111111111"];
const wall=(gx,gy)=>map[gy]?.[gx]!=='0';const keyPos={x:9.5,y:10.8},genPos={x:2.5,y:1.5},exitPos={x:10.7,y:1.6};
let x=2.2,y=8.2,a=-Math.PI/2,light=true,hasKey=false,generator=false,escaped=false,monster={x:6,y:6,active:false},t=0,started=false,dead=false;
const k={up:0,down:0,left:0,right:0,turnL:0,run:0};
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by)}
function move(dt){const sp=(k.run?2.35:1.3)*dt;let nx=x,ny=y;if(k.up){nx+=Math.cos(a)*sp;ny+=Math.sin(a)*sp}if(k.down){nx-=Math.cos(a)*sp;ny-=Math.sin(a)*sp}if(k.left)a-=1.9*dt;if(k.right)a+=1.9*dt;if(k.turnL)a-=1.9*dt;if(!wall(Math.floor(nx),Math.floor(y)))x=nx;if(!wall(Math.floor(x),Math.floor(ny)))y=ny;x=Math.max(1.1,Math.min(10.9,x));y=Math.max(1.1,Math.min(11.9,y));}
function cast(angle){const rx=Math.cos(angle),ry=Math.sin(angle);let d=0;while(d<18){d+=.035;if(wall(Math.floor(x+rx*d),Math.floor(y+ry*d)))return d}return 18}
function interact(){if(!started||dead||escaped)return;if(!hasKey&&dist(x,y,keyPos.x,keyPos.y)<1.35){hasKey=true;msg.textContent='وجدت المفتاح. الآن ابحث عن المولد في الجهة الشمالية.';return}if(hasKey&&!generator&&dist(x,y,genPos.x,genPos.y)<1.5){generator=true;monster.active=true;msg.textContent='اشتغل المولد... لكن شيئًا استيقظ داخل المنزل.';return}if(generator&&dist(x,y,exitPos.x,exitPos.y)<1.5){escaped=true;monster.active=false;msg.textContent='نجوت من المنزل. أم أنك تعتقد ذلك؟';return}msg.textContent='لا يوجد شيء هنا يمكنك استخدامه.'}
function updateMonster(dt){if(!monster.active||escaped)return;const dx=x-monster.x,dy=y-monster.y,d=Math.hypot(dx,dy);const speed=.52*dt;if(d>0.001){monster.x+=dx/d*speed;monster.y+=dy/d*speed}if(d<.72){dead=true;started=false;msg.textContent='أمسك بك الظل. أعد المحاولة.';game.classList.add('hit');setTimeout(()=>game.classList.remove('hit'),450)}}
function render(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#050910');sky.addColorStop(.47,'#15171c');sky.addColorStop(.48,'#171313');sky.addColorStop(1,'#050505');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const fov=Math.PI/3,cols=Math.min(480,Math.max(220,Math.floor(W/2)));for(let i=0;i<cols;i++){const aa=a-fov/2+fov*i/cols;const raw=cast(aa),d=raw*Math.cos(aa-a),hh=Math.min(H*1.5,H/(d*.68));let shade=Math.max(14,158-d*12);if(!light)shade*=.42;ctx.fillStyle=`rgb(${shade*.82},${shade*.85},${shade*.9})`;ctx.fillRect(i*W/cols,(H-hh)/2,W/cols+1,hh)}
let vign=ctx.createRadialGradient(W/2,H*.48,25,W/2,H*.48,Math.max(W,H)*.7);vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,light?'rgba(0,0,0,.7)':'rgba(0,0,0,.91)');ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
if(monster.active){const md=dist(x,y,monster.x,monster.y);if(md<7){const side=Math.atan2(monster.y-y,monster.x-x)-a;let sx=W/2+Math.tan(Math.max(-1.25,Math.min(1.25,side)))*W*.55;const size=Math.max(25,Math.min(250,190/md));const sy=H*.48;ctx.fillStyle='#050505';ctx.beginPath();ctx.ellipse(sx,sy,size*.35,size,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ddd';ctx.fillRect(sx-size*.22,sy-size*.18,size*.1,size*.045);ctx.fillRect(sx+size*.12,sy-size*.18,size*.1,size*.045)}}
}
function loop(now){const dt=Math.min(.04,(now-(loop.last||now))/1000);loop.last=now;if(started&&!dead&&!escaped){t+=dt;move(dt);updateMonster(dt);timeEl.textContent='12:'+String(Math.floor(t)%60).padStart(2,'0')+' AM';if(!hasKey&&dist(x,y,keyPos.x,keyPos.y)<1.8)msg.textContent='أشعر بوجود شيء قريب... هذا المكان ليس فارغًا.';if(monster.active&&dist(x,y,monster.x,monster.y)<2.2)msg.textContent='إنه قريب جدًا... اهرب!'}render();requestAnimationFrame(loop)}
document.getElementById('play').onclick=()=>{started=true;start.classList.add('hidden');msg.textContent='ابحث عن المفتاح... ولا تثق بالأصوات.'};
document.querySelectorAll('[data-k]').forEach(b=>{const key=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(key==='light'){if(started&&!dead)light=!light;return}if(key==='interact'){interact();return}k[key]=1});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{if(key in k)k[key]=0}))});
addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')k.up=1;if(e.key==='s'||e.key==='ArrowDown')k.down=1;if(e.key==='a'||e.key==='ArrowLeft')k.left=1;if(e.key==='d'||e.key==='ArrowRight')k.right=1;if(e.key==='Shift')k.run=1;if(e.key===' ')interact()});addEventListener('keyup',e=>{if(e.key==='w'||e.key==='ArrowUp')k.up=0;if(e.key==='s'||e.key==='ArrowDown')k.down=0;if(e.key==='a'||e.key==='ArrowLeft')k.left=0;if(e.key==='d'||e.key==='ArrowRight')k.right=0;if(e.key==='Shift')k.run=0});requestAnimationFrame(loop);
})();
</script></body></html>
